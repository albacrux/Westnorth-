plugins {
    id 'com.android.application'
}

android {
    namespace 'org.wesnoth.Wesnoth'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        // Westnorth: own package id so the fork installs next to the official app.
        applicationId "io.github.albacrux.westnorth"
        minSdk 23
        targetSdk 35
        // Westnorth: CI passes the run number so every APK upgrades the previous one.
        versionCode((System.getenv("WESTNORTH_BUILD") ?: "1").toInteger())
        versionName "1.21.0-dev+westnorth." + (System.getenv("WESTNORTH_BUILD") ?: "local")
    }

    buildFeatures {
        buildConfig true
    }
    
    signingConfigs {
        // Westnorth: fixed dev-only key (committed on purpose, see CLAUDE.md) so that
        // a new debug APK installs over the old one and keeps saves/add-ons.
        westnorthDebug {
            storeFile = file("westnorth-debug.keystore")
            storePassword "android"
            keyAlias "westnorthdebug"
            keyPassword "android"
        }
        release {
            storeFile = file("wesnoth.keystore")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.westnorthDebug
            ndk {
                debugSymbolLevel 'FULL'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            ndk {
                debugSymbolLevel 'NONE'
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a" // Westnorth: target is the Galaxy A06 (arm64 only)
            universalApk false
        }
    }
    
    // Use custom APK versionCode for each ABI
    def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiCode = abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI), 0)
            // Westnorth: single ABI, keep the plain run-number versionCode.
            output.versionCodeOverride = defaultConfig.versionCode
        }
    }

    dependencies {
        implementation "androidx.core:core:1.16.0"
        implementation "androidx.documentfile:documentfile:1.1.0"
    }
}
