#textdomain wesnoth-test

# Westnorth: small open map for testing touch controls (docs/westnorth/diagnostico-toque.md).
# Run with:  wesnoth -t westnorth_touch
# Side 1 has a leader and two fighters; side 2 has one enemy two hexes away
# and one enemy right next to a fighter.

[test]
    name=_"Westnorth touch test"
    id=westnorth_touch
    turns=unlimited
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    map_data="Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
"

    [side]
        side=1
        controller=human
        suppress_end_turn_confirmation=yes
        team_name=us
        type=Lieutenant
        x,y=2,4
        canrecruit=yes
        {NOTRAIT_UNIT 1 "Spearman" 4 4}
        {NOTRAIT_UNIT 1 "Spearman" 7 6}
    [/side]

    [side]
        side=2
        controller=ai
        team_name=them
        no_leader=yes
        {NOTRAIT_UNIT 2 "Thug" 7 4}
        {NOTRAIT_UNIT 2 "Thug" 8 6}
    [/side]
[/test]
