#textdomain wesnoth-test

# Westnorth: a Spearman with full experience advances at the start, to check
# the advancement choice dialog on the phone screen (redesenho-combate.md 3.4).
# Run with:  wesnoth -t westnorth_advance

[test]
    name=_"Westnorth advancement test"
    id=westnorth_advance
    turns=unlimited
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    map_data="Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg
"

    [side]
        side=1
        controller=human
        team_name=us
        type=Lieutenant
        x,y=2,2
        canrecruit=yes
        [unit]
            type=Spearman
            id=westnorth_advancer
            x,y=4,2
        [/unit]
    [/side]

    [event]
        name=start
        [lua]
            code=<<
                local u = wesnoth.units.get("westnorth_advancer")
                u.experience = u.max_experience
                wesnoth.units.advance(u, false, true)
            >>
        [/lua]
    [/event]
[/test]
