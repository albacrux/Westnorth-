#textdomain wesnoth-test

# Westnorth: a character message and a choice, to check the [message] dialog on
# the phone screen (docs/westnorth/manual-ui-android.md).
# Run with:  wesnoth -t westnorth_message

[test]
    name=_"Westnorth message test"
    id=westnorth_message
    turns=unlimited
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    map_data="Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
"

    [side]
        side=1
        controller=human
        suppress_end_turn_confirmation=yes
        team_name=us
        type=Lieutenant
        id=westnorth_speaker
        name=_"Delfador"
        x,y=3,3
        canrecruit=yes
    [/side]

    [event]
        name=start
        [message]
            speaker=westnorth_speaker
            message=_"The orcs crossed the river at dawn. If we hold the ford until nightfall, the reinforcements from the capital will arrive in time; if we fall back now, the villages on the eastern bank are lost."
        [/message]
        [message]
            speaker=westnorth_speaker
            message=_"What do we do?"
            [option]
                label=_"Hold the ford"
            [/option]
            [option]
                label=_"Fall back to the villages"
            [/option]
        [/message]
    [/event]
[/test]
