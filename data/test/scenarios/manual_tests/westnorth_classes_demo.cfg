#textdomain wesnoth-test

# Westnorth: try the job classes by hand.  wesnoth -t westnorth_classes_demo
# Units stand on a village and a castle so "Mudar de classe..." shows in the
# context menu (right click / long press on the unit).

[test]
    name=_"Westnorth classes demo"
    id=westnorth_classes_demo
    turns=unlimited
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}

    map_data="Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Ch, 1 Kh, Ch, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Ch, Gg, Gg^Vh, Gg, Gg, Gg, Gg, 2 Kh, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg
"

    [side]
        side=1
        controller=human
        team_name=us
        type=WN_Squire2
        canrecruit=yes
        recruit=WN_Squire,WN_Knight,WN_Archer,WN_Thief,WN_WhiteMage,WN_BlackMage
        gold=200
        [unit]
            type=WN_Archer
            x,y=6,5
            experience=25
        [/unit]
        [unit]
            type=WN_Thief
            x,y=3,4
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=them
        type=WN_BlackMage2
        canrecruit=yes
    [/side]

    {WN_CLASS_SYSTEM}
[/test]
