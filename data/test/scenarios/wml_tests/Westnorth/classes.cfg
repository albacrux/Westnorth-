#textdomain wesnoth-test

#####
# Westnorth job classes (data/westnorth, docs/westnorth/classes.md).
# One test per behaviour so a failure names what broke.
#####

#define WN_CLASS_TEST NAME CODE
    {GENERIC_UNIT_TEST {NAME} (
        [event]
            name=start
            [lua]
                code=<<local classes = wesnoth.dofile "westnorth/lua/classes.lua"
>> + {CODE} + <<
unit_test.succeed()>>
            [/lua]
        [/event]
    )}
#enddef

#####
# Every class has two existing unit types, level 1 advances to level 2 of the
# same class, and level 2 does not advance further (AMLA only).
#####
{WN_CLASS_TEST "westnorth_classes_types" <<
    for _, c in ipairs(classes.list) do
        local t1 = wesnoth.unit_types[c.levels[1]]
        local t2 = wesnoth.unit_types[c.levels[2]]
        unit_test.assert(t1 ~= nil, "missing type " .. c.levels[1])
        unit_test.assert(t2 ~= nil, "missing type " .. c.levels[2])
        unit_test.assert_equal(t1.level, 1, c.levels[1] .. " level")
        unit_test.assert_equal(t2.level, 2, c.levels[2] .. " level")
        unit_test.assert_equal(#t1.advances_to, 1, c.levels[1] .. " advancement count")
        unit_test.assert_equal(t1.advances_to[1], c.levels[2], c.levels[1] .. " advances to")
        unit_test.assert_equal(#t2.advances_to, 0, c.levels[2] .. " must not advance")
        unit_test.assert_greater(t1.cost, 0, c.levels[1] .. " cost")
        unit_test.assert_greater(t2.cost, t1.cost, c.levels[2] .. " costs more than level 1")
    end
>>}

#####
# Each class has the ability or weapon special that defines how it plays.
#####
{WN_CLASS_TEST "westnorth_classes_identity" <<
    local function has_ability(type_id, ability)
        local u = wesnoth.units.create { type = type_id, random_traits = false }
        wesnoth.units.to_map(u, 3, 3)
        local ok = u:matches { ability = ability }
        u:erase()
        return ok
    end
    local function has_special(type_id, special)
        local u = wesnoth.units.create { type = type_id, random_traits = false }
        for _, atk in ipairs(u.attacks) do
            if atk:matches { special_id = special } then return true end
        end
        return false
    end
    unit_test.assert(has_ability("WN_Squire", "steadfast"), "Escudeiro: steadfast")
    unit_test.assert(has_ability("WN_Squire2", "leadership"), "Guardião: leadership")
    unit_test.assert(has_special("WN_Knight", "slow"), "Cavaleiro: slows")
    unit_test.assert(has_special("WN_Knight2", "slow"), "Cavaleiro Rúnico: slows")
    unit_test.assert(has_special("WN_Archer", "marksman"), "Arqueiro: marksman")
    unit_test.assert(has_special("WN_Archer2", "marksman"), "Atirador: marksman")
    unit_test.assert(has_ability("WN_Thief", "skirmisher"), "Ladino: skirmisher")
    unit_test.assert(has_special("WN_Thief", "backstab"), "Ladino: backstab")
    unit_test.assert(has_special("WN_Thief2", "poison"), "Sombra: poison")
    unit_test.assert(has_ability("WN_WhiteMage", "healing"), "Mago Branco: heals")
    unit_test.assert(has_ability("WN_WhiteMage2", "curing"), "Sacerdote: cures")
    unit_test.assert(has_special("WN_BlackMage", "magical"), "Mago Negro: magical")
    -- The Mago Branco's projectile is arcane (patched over the Mage's fire).
    local wm = wesnoth.units.create { type = "WN_WhiteMage", random_traits = false }
    unit_test.assert_equal(wm.attacks[2].type, "arcane", "Mago Branco attack type")
>>}

#####
# Changing class keeps experience, traits and the share of hit points,
# keeps the level, and uses up the unit's turn.
#####
{WN_CLASS_TEST "westnorth_classes_change_keeps_progress" <<
    local u = wesnoth.units.create { type = "WN_Squire", side = 1, random_traits = true }
    wesnoth.units.to_map(u, 3, 3)
    u.experience = 20
    u.hitpoints = math.floor(u.max_hitpoints / 2)
    local traits_before = {}
    for t in wml.child_range(wml.get_child(u.__cfg, "modifications") or {}, "trait") do
        table.insert(traits_before, t.id)
    end
    unit_test.assert_greater(#traits_before, 0, "test unit should have traits")

    unit_test.assert(classes.change(u, "archer"), "change returned false")
    unit_test.assert_equal(u.type, "WN_Archer", "new type")
    unit_test.assert_equal(u.level, 1, "level kept")
    unit_test.assert_equal(u.experience, 20, "experience kept")
    unit_test.assert_in_range(u.hitpoints, math.floor(u.max_hitpoints / 2) - 1, math.ceil(u.max_hitpoints / 2) + 1, "half hit points kept")
    unit_test.assert_equal(u.moves, 0, "moves spent")
    unit_test.assert_equal(u.attacks_left, 0, "attack spent")

    local traits_after = {}
    for t in wml.child_range(wml.get_child(u.__cfg, "modifications") or {}, "trait") do
        table.insert(traits_after, t.id)
    end
    unit_test.assert_equal(table.concat(traits_after, ","), table.concat(traits_before, ","), "traits kept")
>>}

#####
# Experience above the new class's maximum is capped so the unit does not
# advance on the spot; level 2 units change to the level 2 of the new class.
#####
{WN_CLASS_TEST "westnorth_classes_change_caps_experience" <<
    local u = wesnoth.units.create { type = "WN_Thief", side = 1, random_traits = false }
    wesnoth.units.to_map(u, 3, 3)
    u.experience = u.max_experience - 1   -- Ladino needs 36, Mago Branco 48
    classes.change(u, "whitemage")
    unit_test.assert_equal(u.type, "WN_WhiteMage", "new type")
    unit_test.assert_less(u.experience, u.max_experience, "no instant advancement")

    local v = wesnoth.units.create { type = "WN_Knight2", side = 1, random_traits = false }
    v.experience = 500
    classes.change(v, "blackmage")
    unit_test.assert_equal(v.type, "WN_BlackMage2", "level 2 stays level 2")
    unit_test.assert_equal(v.experience, v.max_experience - 1, "experience capped")
    unit_test.assert(not classes.change(v, "blackmage"), "changing to the same class is refused")
>>}

#####
# Class change is only allowed on villages and castles, and not after attacking.
#####
{WN_CLASS_TEST "westnorth_classes_change_rules" <<
    -- Any hex where a change is allowed (the generic test map has castles) and any where it is not.
    local village = wesnoth.map.find { terrain = classes.change_terrain }[1]
    local plain = wesnoth.map.find { include_borders = false, wml.tag["not"] { terrain = classes.change_terrain } }[1]
    unit_test.assert(village ~= nil, "test map needs a village or castle")
    unit_test.assert(plain ~= nil, "test map needs a plain hex")
    local u = wesnoth.units.create { type = "WN_Squire", side = 1, random_traits = false }
    wesnoth.units.to_map(u, plain.x, plain.y)
    unit_test.assert(classes.cannot_change_reason(u) ~= nil, "plain terrain must be refused")
    u:to_map(village.x, village.y)
    unit_test.assert_equal(classes.cannot_change_reason(u), nil, "village/castle must be allowed")
    u.attacks_left = 0
    unit_test.assert(classes.cannot_change_reason(u) ~= nil, "after attacking must be refused")
    local peasant = wesnoth.units.create { type = "Peasant", side = 1 }
    unit_test.assert(classes.cannot_change_reason(peasant) ~= nil, "non-class units are refused")
>>}

#undef WN_CLASS_TEST
