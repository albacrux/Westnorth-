#textdomain wesnoth

# wmlscope: set export=no

# Westnorth: phone HUD (docs/westnorth/redesenho-combate.md, prototype
# docs/westnorth/prototipos/1-mapa.jpg). The map fills the screen; everything
# else floats over it in the corners:
#   top left      menu button
#   top           turn, gold, income, villages and time of day
#   top right     minimap
#   bottom left   unit card, only while a unit is displayed (tap: details),
#                 with the terrain line under the finger above it
#   bottom right  End Turn, Undo and Next Unit, under the right thumb
# Sizes are for 1280x720 and up; right/bottom elements follow the screen edge.
# Images: utils/westnorth/make_hud_images.py.

#define _WN_HUD_FONT_BIG
22#enddef
#define _WN_HUD_ICON X ID IMAGE
    [label]
        id={ID}
        icon={IMAGE}
        rect="{X},25,+26,+26"
        xanchor=fixed
        yanchor=fixed
    [/label]
#enddef

[theme]
    id=Westnorth
    name= _ "Westnorth (phone)"
    description= _ "Full-screen map with floating cards, made for phones in landscape."

    [resolution]
        id=1280x720
        width=1280
        height=720

        {MAIN_MAP_BORDER}

        [screen]
            id=screen
            rect="0,0,1280,720"
        [/screen]

        # Invisible; the replay controls hang from it.
        [panel]
            id=top-panel
            rect="0,0,1280,64"
            xanchor=left
            yanchor=fixed
        [/panel]

        [main_map]
            id=main-map
            rect="0,0,1280,720"
            xanchor=left
            yanchor=top
        [/main_map]

        # ---- top left: menu
        [menu]
            id=menu-main
            image=westnorth/hud_menu
            tooltip= _ "Menu"
            items=recruit,recall,objectives,statustable,unitlist,showenemymoves,save,load,preferences,help,menu-main-more,stopnetwork,startnetwork,surrender,quit,quit-to-desktop
            rect="16,12,+60,+52"
            xanchor=fixed
            yanchor=fixed
        [/menu]
        [menu]
            title= _ "More..."
            id=menu-main-more
            button=false
            items=achievements,statistics,menu-autosaves,menu-quickreplay,savereplay,savemap,chatlog,bestenemymoves,delayshroud,updateshroud,wbtoggle,wbexecuteallactions,speak,label_settings,command
        [/menu]
        [menu]
            title= _ "Load Turn..."
            id=menu-autosaves
            button=false
            items=AUTOSAVES,help-about-saveload
        [/menu]
        [menu]
            title= _ "Replay Turn..."
            id=menu-quickreplay
            button=false
            items=QUICKREPLAY,help-about-saveload
        [/menu]

        # Long press on the map.
        [menu]
            is_context_menu=true
            items="continue,recruit,recall,wml,undo,redo," +
                "wbexecuteaction,wbdeleteaction,wbbumpupaction,wbbumpdownaction,wbsupposedead," +
                "describeunit,describeterrain," +
                "zoomin,zoomout,zoomdefault," +
                "createunit,changeside,killunit,teleportunit," +
                "labelterrain,clearlabels," +
                "delayshroud,updateshroud"
        [/menu]

        # ---- top: resources
        [panel]
            id=wn-top-pill
            image=westnorth/hud/top-pill.png
            rect="88,12,+560,+52"
            xanchor=fixed
            yanchor=fixed
        [/panel]
        {_WN_HUD_ICON 216 gold-icon themes/gold.png}
        {_WN_HUD_ICON 326 income-icon themes/income.png}
        {_WN_HUD_ICON 430 villages-icon themes/villages.png}

        # ---- top right: minimap
        [panel]
            id=wn-minimap-frame
            image=westnorth/hud/minimap-frame.png
            rect="1022,12,+246,+150"
            xanchor=right
            yanchor=fixed
        [/panel]
        [mini_map]
            id=mini-map
            rect="1028,18,+234,+138"
            xanchor=right
            yanchor=fixed
        [/mini_map]

        [status]
            [side_playing]
                id=icon-sideplaying
                rect="106,25,+26,+26"
                xanchor=fixed
                yanchor=fixed
            [/side_playing]
            [turn]
                id=turn
                font_size={_WN_HUD_FONT_BIG}
                rect="136,23,+72,+30"
                xanchor=fixed
                yanchor=fixed
            [/turn]
            [gold]
                id=gold
                font_size={_WN_HUD_FONT_BIG}
                rect="246,23,+72,+30"
                xanchor=fixed
                yanchor=fixed
            [/gold]
            [income]
                id=status-income
                font_size={_WN_HUD_FONT_BIG}
                rect="362,23,+60,+30"
                xanchor=fixed
                yanchor=fixed
            [/income]
            [villages]
                id=villages
                font_size={_WN_HUD_FONT_BIG}
                rect="460,23,+80,+30"
                xanchor=fixed
                yanchor=fixed
            [/villages]
            [time_of_day]
                id=image-tod
                rect="544,23,+96,+30"
                xanchor=fixed
                yanchor=fixed
            [/time_of_day]

            # ---- bottom left: terrain line and unit card
            [westnorth_hex]
                id=westnorth-hex
                background=westnorth/hud/chip.png
                padding=10
                font_size=20
                rect="262,446,+440,+46"
                xanchor=fixed
                yanchor=bottom
            [/westnorth_hex]
            [westnorth_unit_card]
                id=westnorth-unit-card
                background=westnorth/hud/card.png
                rect="16,504,+640,+200"
                xanchor=fixed
                yanchor=bottom
            [/westnorth_unit_card]
            # The portrait rises above the card, like in mobile games.
            [unit_profile]
                id=wn-unit-profile
                rect="22,452,+200,+200"
                xanchor=fixed
                yanchor=bottom
            [/unit_profile]
            [unit_status]
                id=unit-status
                rect="26,620,+180,+28"
                xanchor=fixed
                yanchor=bottom
            [/unit_status]
            [unit_type]
                id=unit-type
                font_size=28
                font_rgb=186,172,125
                rect="232,512,+252,+38"
                xanchor=fixed
                yanchor=bottom
            [/unit_type]
            [unit_level]
                id=unit-level
                prefix= _ "level^Lv"
                prefix_literal=" "
                font_size=16
                font_rgb=128,128,128
                rect="490,524,+48,+24"
                xanchor=fixed
                yanchor=bottom
            [/unit_level]
            [unit_alignment]
                id=unit-alignment
                font_size=16
                rect="538,524,+100,+24"
                xanchor=fixed
                yanchor=bottom
            [/unit_alignment]
            [westnorth_hp_bar]
                id=westnorth-hp-bar
                rect="232,562,+250,+18"
                xanchor=fixed
                yanchor=bottom
            [/westnorth_hp_bar]
            [unit_hp]
                id=unit-hp
                font_size=28
                rect="492,550,+94,+38"
                xanchor=fixed
                yanchor=bottom
            [/unit_hp]
            [unit_moves]
                id=unit-moves
                font_size=22
                prefix_literal="<span size='12000' color='#808080'>MP </span>"
                rect="586,554,+68,+30"
                xanchor=fixed
                yanchor=bottom
            [/unit_moves]
            [westnorth_xp_bar]
                id=westnorth-xp-bar
                rect="232,594,+250,+8"
                xanchor=fixed
                yanchor=bottom
            [/westnorth_xp_bar]
            [unit_xp]
                id=unit-xp
                font_size=16
                rect="492,586,+110,+24"
                xanchor=fixed
                yanchor=bottom
            [/unit_xp]
            [unit_weapons]
                id=unit-weapons
                font_size=18
                rect="232,612,+416,+88"
                xanchor=fixed
                yanchor=bottom
            [/unit_weapons]
        [/status]

        # Tap on the card: unit description. Hidden while there is no card
        # (src/display.cpp), so it never blocks taps on the map.
        [action]
            id=button-westnorth-details
            image=westnorth/hud_card
            items=describeunit
            rect="16,504,+640,+200"
            xanchor=fixed
            yanchor=bottom
        [/action]

        # ---- bottom right: under the right thumb
        [action]
            id=button-westnorth-undo
            image=westnorth/hud_round
            title= _ "Undo"
            font_size=15
            items=undo
            rect="1010,516,+84,+84"
            xanchor=right
            yanchor=bottom
        [/action]
        [action]
            id=button-westnorth-next-unit
            image=westnorth/hud_round
            # Selects the next unit that can still move or attack and
            # centers the map on it.
            title= _ "button^Next unit"
            tooltip= _ "Next unit that can still move or attack"
            font_size=15
            items=cycle
            rect="1106,516,+84,+84"
            xanchor=right
            yanchor=bottom
        [/action]
        [action]
            id=button-endturn
            image=westnorth/hud_endturn
            title= _ "End Turn"
            title2= _ "End Scenario"
            font_size=26
            items=endturn
            rect="964,612,+300,+92"
            xanchor=right
            yanchor=bottom
        [/action]

        {REPLAY_THEME 15}
    [/resolution]
[/theme]

#undef _WN_HUD_FONT_BIG
#undef _WN_HUD_ICON
