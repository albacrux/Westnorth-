#textdomain wesnoth

# wmlscope: set export=no

# some information about how theming works (especially the coordinates
# defined with rect=):
# https://www.wesnoth.org/forum/viewtopic.php?p=213708#213708

#define DEFAULT_FONT_NORMAL
17#enddef
#define DEFAULT_FONT_SMALL
15#enddef
#define DEFAULT_FONT_TINY
13#enddef
#define DEFAULT_FONT_REALLYTINY
11#enddef

#define DEFAULT_FONT_NORMAL_HEIGHT
22#enddef
#define DEFAULT_FONT_SMALL_HEIGHT
19#enddef
#define DEFAULT_FONT_TINY_HEIGHT
17#enddef
#define DEFAULT_FONT_REALLYTINY_HEIGHT
15#enddef
#define DEFAULT_FONT_REALLYTINY_HEIGHT_SHORTER
13#enddef

# Westnorth: text size of the phone sidebar (1024x600 layout)
#define WN_PHONE_FONT
16#enddef
#define WN_PHONE_FONT_HEIGHT
20#enddef

#define FONT_RGB_LEVEL1
245,230,193#enddef

[theme]
    id=Default
    name= _ "theme^Default"
    description= _ "The default theme"

    [resolution]
        id=1024x768
        width=1024
        height=768

        [screen]
            # this is only useful as a ref for other rects
            id=screen
            rect="0,0,1024,768"
        [/screen]

        [panel]
            id=top-panel
            image=themes/classic/menubar.png
            ref=screen
            rect="=,=,+842,+27"
            xanchor=top
            yanchor=fixed
        [/panel]

        [panel]
            id=map-area
            ref=top-panel
            rect="=,+0,+842,768"
            xanchor=left
            yanchor=top
        [/panel]

        [main_map]
            id=main-map
            ref=map-area
            rect="=,=,=,="
            xanchor=left
            yanchor=top
        [/main_map]

        {MAIN_MAP_BORDER}

        # rightside panel

        [panel]
            id=sidebar-panel
            image=themes/classic/sidebar.png
            rect="+0,0,1024,768"
            xanchor=right
            yanchor=top
        [/panel]

        {MINIMAP_THEME}
        {STATUS_BOX =+0 +3 +122 +36 tod terrain-description-box-botleft right fixed}
        {STATUS_BOX =+0 +5 +72 +72 unit tod-box-botleft right fixed}

        [menu]
            id=menu-main
            title= _ "Menu"
            image=button_menu/menu_button_copper_H20
            # Westnorth: rarely used entries live in "More..." so the menu fits a phone screen
            items=objectives,statustable,unitlist,save,load,preferences,help,menu-main-more,stopnetwork,startnetwork,surrender,quit,quit-to-desktop
            ref=top-panel
            rect="=,=+1,+100,=-4"
            xanchor=fixed
            yanchor=fixed
        [/menu]

        [menu]
            title= _ "More..."
            id=menu-main-more
            button=false
            items=achievements,statistics,menu-autosaves,menu-quickreplay,savereplay,savemap,chatlog
        [/menu]

        [menu]
            title= _ "Load Turn..."
            id=menu-autosaves
            button=false
            items=AUTOSAVES,help-about-saveload
        [/menu]

        [menu]
            title= _ "Replay Turn..."
            id=menu-quickreplay
            button=false
            items=QUICKREPLAY,help-about-saveload
        [/menu]

        [menu]
            id=actions-menu
            title= _ "Actions"
            image=button_menu/menu_button_copper_H20
            items=undo,redo,wbexecuteallactions,wbexecuteaction,wbdeleteaction,cycle,recruit,recall,showenemymoves,delayshroud,updateshroud,actions-menu-more
            rect="+0,=,+100,="
            xanchor=fixed
            yanchor=fixed
        [/menu]
        [menu]
            title= _ "More..."
            id=actions-menu-more
            button=false
            items=wbtoggle,bestenemymoves,speak,label_settings,command
        [/menu]
        {STATUS_BOX_BORDERLESS +5 =+0 +95 +15 turn     actions-menu           fixed fixed}
        {STATUS_BOX_BORDERLESS +3 =+0 +75 +15 gold     turn-box-topright      fixed fixed}
        {STATUS_BOX_BORDERLESS +3 =+0 +70 +15 villages gold-box-topright      fixed fixed}
        {STATUS_BOX_BORDERLESS +3 =+0 +65 +15 units    villages-box-topright  fixed fixed}
        {STATUS_BOX_BORDERLESS +3 =+0 +85 +15 upkeep   units-box-topright     fixed fixed}
        {STATUS_BOX_BORDERLESS +3 =+0 +60 +15 income   upkeep-box-topright    fixed fixed}
        {STATUS_BOX_BORDERLESS +3 =+0 +85 +15 battery  income-box-topright    fixed fixed}
        {COUNTDOWN_THEME}
        [menu]
            is_context_menu=true
            # Basic commands
            items="continue,recruit,recall,wml,undo,redo," +
                # Whiteboard commands
                "wbexecuteaction,wbdeleteaction,wbbumpupaction,wbbumpdownaction,wbsupposedead," +
                # Information
                "describeterrain,describeunit,renameunit," +
                # Zoom
                "zoomin,zoomout,zoomdefault," +
                # Debug commands
                "createunit,changeside,killunit,teleportunit," +
                # Labels
                "labelterrain,clearlabels," +
                # Shroud updates
                "delayshroud,updateshroud"
        [/menu]
        [action]
            id=button-endturn
            image=large-button
            title=  _ "End Turn"
            title2= _ "End Scenario"
            items=endturn
            ref=sidebar-panel
            rect="-173,-50,+168,+44"
            xanchor=right
            yanchor=bottom
        [/action]

        # HP/XP
        [label]
            id=label-hp
            font_size={DEFAULT_FONT_TINY}
            text= _ "HP"
            ref=unit-box-topright
            rect="+4,=-1,+60,+14"
            xanchor=right
            yanchor=fixed
        [/label]
        [label]
            id=label-xp
            font_size={DEFAULT_FONT_TINY}
            text= _ "XP"
            rect="=,+14,=,+14"
            xanchor=right
            yanchor=fixed
        [/label]
        [label]
            id=label-mp
            font_size={DEFAULT_FONT_TINY}
            text= _ "MP"
            rect="=,+14,=,+14"
            xanchor=right
            yanchor=fixed
        [/label]
        [label]
            id=label-def
            font_size={DEFAULT_FONT_TINY}
            text= _ "def"
            ref=label-xp
            rect="+1,=,+25,+14"
            xanchor=right
            yanchor=fixed
        [/label]

        [label]
            id=gold-icon
            icon=themes/gold.png
            ref=gold-box-center
            rect="=+1,=-1,+17,+17"
            xanchor=fixed
            yanchor=fixed
        [/label]
        [label]
            id=villages-icon
            icon=themes/villages.png
            ref=villages-box-center
            rect="=+1,=-1,+17,+17"
            xanchor=fixed
            yanchor=fixed
        [/label]
        [label]
            id=units-icon
            icon=themes/units.png
            ref=units-box-center
            rect="=+1,=-1,+17,+17"
            xanchor=fixed
            yanchor=fixed
        [/label]
        [label]
            id=upkeep-icon
            icon=themes/upkeep.png
            ref=upkeep-box-center
            rect="=+1,=-1,+25,+17"
            xanchor=fixed
            yanchor=fixed
        [/label]
        [label]
            id=income-icon
            icon=themes/income.png
            ref=income-box-center
            rect="=+1,=-1,+25,+17"
            xanchor=fixed
            yanchor=fixed
        [/label]

        [status]
            # The size of these rectangles only accommodates hex coordinates
            # up to 999.
            [position]
                id=status-position
                font_size={DEFAULT_FONT_SMALL}
                ref=terrain-info-box-center
                rect="=+2,=-2,+95,+16"
                xanchor=right
                yanchor=fixed
            [/position]
            [terrain_info]
                id=status-terrain
                font_size={DEFAULT_FONT_SMALL}
                rect="+2,=+1,+70,+16"
                xanchor=right
                yanchor=fixed
            [/terrain_info]
            [terrain]
                id=terrain-description
                ref=terrain-description-box-center
                rect="=+1,=-1,+165,+16"
                font_size={DEFAULT_FONT_TINY}
                xanchor=right
                yanchor=fixed
            [/terrain]

            # the time of day image
            [time_of_day]
                id=image-tod
                ref=tod-box-center
                rect="=-1,=-2,+125,+39"
                xanchor=right
                yanchor=fixed
            [/time_of_day]
            [tod_stats]
                id=tod-stats
                font_size={DEFAULT_FONT_SMALL}
                rect="+3,=+8,+64,+{DEFAULT_FONT_NORMAL_HEIGHT}"
                xanchor=right
                yanchor=fixed
            [/tod_stats]
            # TODO think about alignment right of tod image
            # [unit_alignment]
            #     ref=tod-stats
            #     id=unit-alignment
            #     font_size={DEFAULT_FONT_SMALL}
            #     rect="=,+0,=,+16"
            #     xanchor=right
            #     yanchor=fixed
            # [/unit_alignment]
            [unit_status]
                id=unit-status
                font_size={DEFAULT_FONT_SMALL}
                ref=label-hp
                rect="+0,=-4,+32,+16"
                xanchor=right
                yanchor=fixed
            [/unit_status]

            #put the side playing indicator next to the turn indicator
            [side_playing]
                id=icon-sideplaying
                ref=turn-box-center
                rect="=+1,=-1,+25,+17"
                xanchor=fixed
                yanchor=fixed
            [/side_playing]

            # the game status
            [turn]
                id=turn
                font_size={DEFAULT_FONT_SMALL}
                rect="+4,=-2,+65,+16"
                xanchor=fixed
                yanchor=fixed
            [/turn]
            [gold]
                id=gold
                font_size={DEFAULT_FONT_SMALL}
                ref=gold-icon
                rect="+4,=-2,+55,+16"
                xanchor=fixed
                yanchor=fixed
            [/gold]
            [villages]
                id=villages
                font_size={DEFAULT_FONT_SMALL}
                ref=villages-icon
                rect="+4,=-2,+55,+16"
                xanchor=fixed
                yanchor=fixed
            [/villages]
            [num_units]
                id=num-units
                font_size={DEFAULT_FONT_SMALL}
                ref=units-icon
                rect="+4,=-2,+55,+16"
                xanchor=fixed
                yanchor=fixed
            [/num_units]
            [upkeep]
                id=status-upkeep
                font_size={DEFAULT_FONT_SMALL}
                ref=upkeep-icon
                rect="+4,=-2,+50,+16"
                xanchor=fixed
                yanchor=fixed
            [/upkeep]
            [income]
                id=status-income
                font_size={DEFAULT_FONT_SMALL}
                ref=income-icon
                rect="+4,=-2,+60,+16"
                xanchor=fixed
                yanchor=fixed
            [/income]
            [battery]
                id=status-battery
                font_size={DEFAULT_FONT_SMALL}
                ref=battery-box-center
                rect="=+5,=-3,+80,+18"
                xanchor=fixed
                yanchor=fixed
            [/battery]

            {COUNTDOWN_THEME_STATUS {DEFAULT_FONT_SMALL}}

            [observers]
                id=observers
                font_size={DEFAULT_FONT_SMALL}
                ref=sidebar-panel
                rect="=-22,=+4,+16,+16" # x = 16 + 6
                xanchor=right
                yanchor=fixed
            [/observers]

            #unit stats here
            [unit_image]
                id=unit-image
                ref=unit-box-center
                rect="=+0,=+0,+72,+72"
                xanchor=right
                yanchor=fixed
            [/unit_image]
            [unit_name]
                id=unit-description
                font_size={DEFAULT_FONT_NORMAL}
                ref=unit-box-botleft
                rect="=+3,+5,+128,+20"
                xanchor=right
                yanchor=fixed
            [/unit_name]
            [unit_side]
                id=unit-side
                font_size={DEFAULT_FONT_SMALL}
                rect="+0,=,+50,+16"
                xanchor=right
                yanchor=fixed
            [/unit_side]
            [unit_type]
                ref=unit-description
                id=unit-type
                font_size={DEFAULT_FONT_SMALL}
                rect="=,+0,+140,+18"
                xanchor=right
                yanchor=fixed
            [/unit_type]
            [unit_level]
                id=unit-level
                font_size={DEFAULT_FONT_SMALL}
                rect="+0,=+0,+50,+16"
                prefix= _ "statuspanel^lvl"
                prefix_literal=" "
                xanchor=right
                yanchor=fixed
            [/unit_level]
            [unit_alignment]
                prefix_literal="  "
                font_rgb={FONT_RGB_LEVEL1}
                ref=unit-type
                id=unit-alignment
                font_size={DEFAULT_FONT_SMALL}
                rect="=,+0,=+50,+18"
                xanchor=right
                yanchor=fixed
            [/unit_alignment]
            [unit_abilities]
                prefix_literal="  "
                #  prefix_literal=" "
                font_rgb={FONT_RGB_LEVEL1}
                id=unit-abilities
                font_size={DEFAULT_FONT_SMALL}
                rect="=,+0,=,+18"
                xanchor=right
                yanchor=fixed
            [/unit_abilities]
            [unit_race]
                id=unit-race
                font_size={DEFAULT_FONT_SMALL}
                rect="=,+0,=,+18"
                xanchor=right
                yanchor=fixed
            [/unit_race]
            [unit_traits]
                #ref=unit-type
                id=unit-traits
                prefix_literal="  "
                font_size={DEFAULT_FONT_SMALL}
                font_rgb={FONT_RGB_LEVEL1}
                rect="=,+0,1022,+18"
                xanchor=right
                yanchor=fixed
            [/unit_traits]
            [unit_hp]
                id=unit-hp
                font_size={DEFAULT_FONT_TINY}
                ref=label-hp
                rect="=,+0,+94,+14"
                prefix_literal=" "
                xanchor=right
                yanchor=fixed
            [/unit_hp]
            [unit_xp]
                id=unit-xp
                font_size={DEFAULT_FONT_TINY}
                ref=label-xp
                rect="=,+0,+94,+14"
                prefix_literal=" "
                xanchor=right
                yanchor=fixed
            [/unit_xp]
            [unit_moves]
                ref=label-mp
                id=unit-moves
                font_size={DEFAULT_FONT_TINY}
                rect="=,+0,=-5,+14"
                prefix_literal=" "
                xanchor=right
                yanchor=fixed
            [/unit_moves]
            [unit_defense]
                ref=label-def
                id=unit-defense
                font_size={DEFAULT_FONT_TINY}
                rect="=-5,+0,+30,+14"
                xanchor=right
                yanchor=fixed
            [/unit_defense]
            [unit_vision]
                id=unit-vision
                font_size={DEFAULT_FONT_TINY}
                rect="=,+0,+30,+14"
                xanchor=right
                yanchor=fixed
            [/unit_vision]
            [unit_jamming]
                id=unit-jamming
                font_size={DEFAULT_FONT_TINY}
                rect="=,+0,+30,+14"
                xanchor=right
                yanchor=fixed
            [/unit_jamming]

            # current position not usable, overlays with the status indication (like slow)
            # please find a better place (yes, I know that this is barely possible...)
            [unit_weapons]
                id=unit-weapons
                font_size={DEFAULT_FONT_SMALL}
                ref=unit-traits
                rect="=+0,+12,=,705"
                xanchor=right
                yanchor=top
            [/unit_weapons]
        [/status]

        # If the device has no battery, remove the battery charge indicator
        # and move the timer to its position.
        [no_battery]
            [remove]
                id=battery
            [/remove]

            # Give the battery box the same dimensions as the countdown box
            {CHANGE_STATUS_BOX +3 =+0 +90 +15 battery income-box-topright}

            [change]
                id=report_countdown
                ref=battery-box-center
                rect="=+5,=-3,+80,+18"
            [/change]
        [/no_battery]

        {REPLAY_THEME {DEFAULT_FONT_SMALL}}
    [/resolution]

    [partialresolution]
        id=1024x600
        inherits=1024x768
        width=1024
        height=600

        # Westnorth: phone sidebar. On the Galaxy A06 (1600x720, about 260 ppi)
        # upstream's 11-13 px sidebar text is about 1 mm tall, so the sidebar is
        # 240 px wide instead of 181 and its text is 15-17 px. To make room for
        # that and for the touch buttons at the bottom, HP/XP/MP/defense sit on
        # one line each next to the portrait and the race shares the alignment
        # line.
        {MINIMAP_THEME_600}
        [change]
            id=minimap-panel
            image=themes/westnorth/minimap-240.png
            rect="=,=+6,+240,+170"
        [/change]

        [change]
            id=screen
            rect="0,0,1024,600"
        [/change]
        [change]
            id=sidebar-panel
            image=themes/westnorth/sidebar-240.png
            rect="+0,0,1024,600"
        [/change]
        [change]
            id=map-area
            rect="=,+0,+784,600"
        [/change]

        # Terrain: "x,y defense" and the terrain name, one 22 px line each.
        {CHANGE_STATUS_BOX =+7 +0 +222 +22 terrain-info minimap-panel}
        {CHANGE_STATUS_BOX =+0 -2 +222 +22 terrain-description terrain-info-box-botleft}
        [change]
            id=status-position
            font_size={DEFAULT_FONT_NORMAL}
            rect="=+2,=+0,+130,+{DEFAULT_FONT_NORMAL_HEIGHT}"
        [/change]
        [change]
            id=status-terrain
            font_size={DEFAULT_FONT_NORMAL}
            rect="+2,=+0,+88,+{DEFAULT_FONT_NORMAL_HEIGHT}"
        [/change]
        # MINIMAP_THEME also defines an (unused) top-level element with this
        # id; drop it so the [change] below reaches the real terrain report.
        [remove]
            id=terrain-description
        [/remove]
        [change]
            id=terrain-description
            font_size={DEFAULT_FONT_NORMAL}
            rect="=+1,=+0,+220,+{DEFAULT_FONT_NORMAL_HEIGHT}"
        [/change]
        [change]
            id=tod-stats
            font_size={DEFAULT_FONT_NORMAL}
            rect="+6,=+7,+90,+{DEFAULT_FONT_NORMAL_HEIGHT}"
        [/change]

        # Unit stats: one "label value" line each, right of the 72 px portrait.
        [change]
            id=label-hp
            font_size={DEFAULT_FONT_SMALL}
            ref=unit-box-topright
            rect="+6,=-2,+30,+18"
        [/change]
        [change]
            id=unit-hp
            font_size={DEFAULT_FONT_SMALL}
            ref=label-hp
            rect="+0,=,+110,="
        [/change]
        [change]
            id=label-xp
            font_size={DEFAULT_FONT_SMALL}
            ref=label-hp
            rect="=,+0,=,+18"
        [/change]
        [change]
            id=unit-xp
            font_size={DEFAULT_FONT_SMALL}
            ref=label-xp
            rect="+0,=,+110,="
        [/change]
        [change]
            id=label-mp
            font_size={DEFAULT_FONT_SMALL}
            ref=label-xp
            rect="=,+0,=,+18"
        [/change]
        [change]
            id=unit-moves
            font_size={DEFAULT_FONT_SMALL}
            ref=label-mp
            rect="+0,=,+110,="
        [/change]
        [change]
            id=label-def
            font_size={DEFAULT_FONT_SMALL}
            ref=label-mp
            rect="=,+0,=,+18"
        [/change]
        [change]
            id=unit-defense
            font_size={DEFAULT_FONT_SMALL}
            ref=label-def
            rect="+0,=,+50,="
        [/change]
        [change]
            id=unit-vision
            font_size={DEFAULT_FONT_SMALL}
            ref=unit-defense
            rect="+2,=,+28,="
        [/change]
        [change]
            id=unit-jamming
            font_size={DEFAULT_FONT_SMALL}
            ref=unit-vision
            rect="+2,=,+28,="
        [/change]
        # Status icons (poisoned, slowed...) over the bottom of the portrait.
        [change]
            id=unit-status
            ref=unit-box-center
            rect="=,=+54,+72,+18"
        [/change]

        [change]
            id=unit-description
            font_size={DEFAULT_FONT_NORMAL}
            rect="=+3,+5,+180,+{DEFAULT_FONT_NORMAL_HEIGHT}"
        [/change]
        [change]
            id=unit-side
            font_size={DEFAULT_FONT_SMALL}
            rect="+0,=,+40,+{DEFAULT_FONT_SMALL_HEIGHT}"
        [/change]
        [change]
            id=unit-type
            font_size={WN_PHONE_FONT}
            rect="=,+0,+170,+{WN_PHONE_FONT_HEIGHT}"
        [/change]
        [change]
            id=unit-level
            font_size={WN_PHONE_FONT}
            rect="+0,=+0,+50,+{WN_PHONE_FONT_HEIGHT}"
        [/change]
        [change]
            id=unit-alignment
            font_size={WN_PHONE_FONT}
            ref=unit-type
            rect="=,+0,+128,+{WN_PHONE_FONT_HEIGHT}"
        [/change]
        [change]
            id=unit-abilities
            font_size={WN_PHONE_FONT}
            ref=unit-alignment
            rect="=,+0,+226,+{WN_PHONE_FONT_HEIGHT}"
        [/change]
        [change]
            id=unit-race
            font_size={WN_PHONE_FONT}
            ref=unit-alignment
            rect="+4,=,+94,="
        [/change]
        [change]
            id=unit-traits
            font_size={WN_PHONE_FONT}
            ref=unit-abilities
            rect="=,+0,1022,+{WN_PHONE_FONT_HEIGHT}"
        [/change]
        [change]
            id=unit-weapons
            font_size={WN_PHONE_FONT}
            # Stops above the Undo/Next buttons (y=550 on 720 px).
            rect="=,+4,=,545"
        [/change]
        # Westnorth: this layout is the one phones in landscape get (the Galaxy A06
        # is 1600x720), so its controls are sized for fingers rather than a mouse.
        # "End Turn": 228x80 px (80 px is about 48 dp there), kept 8 px off the screen
        # edges so a system edge gesture does not press it.
        [change]
            id=button-endturn
            image=westnorth/end_turn_W228
            font_size=19
            rect="-236,-88,+228,+80"
        [/change]

        # Undo and Next Unit right above End Turn, where the thumb already is.
        # 112x76 px each (about 68x46 dp); the theme greys them out when the
        # command is not available (nothing to undo, no unit left to move).
        [add]
            [action]
                id=button-westnorth-undo
                image=westnorth/action_W112
                font_size=17
                title= _ "Undo"
                items=undo
                ref=button-endturn
                rect="=,=-82,+112,+76"
                xanchor=right
                yanchor=bottom
            [/action]
        [/add]
        # The theme schema allows one element per [add].
        [add]
            [action]
                id=button-westnorth-next-unit
                image=westnorth/action_W112
                font_size=17
                title= _ "button^Next"
                items=cycle
                ref=button-westnorth-undo
                rect="+4,=,+112,="
                xanchor=right
                yanchor=bottom
            [/action]
        [/add]

        # Taller top bar with bigger Menu/Actions buttons and readable numbers.
        [change]
            id=top-panel
            rect="=,=,+784,+40"
        [/change]
        [change]
            id=menu-main
            image=westnorth/menu_H40
            font_size=19
            rect="=,=,+200,+40"
        [/change]
        [change]
            id=actions-menu
            image=westnorth/menu_H40
            font_size=19
            rect="+0,=,+200,="
        [/change]
        # Status boxes: 20 px numbers and 24 px icons (upstream: 15 and 17).
        {CHANGE_STATUS_BOX +8 =+5 +122 +26 turn     actions-menu}
        {CHANGE_STATUS_BOX +4 =+0 +112 +26 gold     turn-box-topright}
        {CHANGE_STATUS_BOX +4 =+0 +104 +26 villages gold-box-topright}
        {CHANGE_STATUS_BOX +4 =+0 +80 +26 units    villages-box-topright}
        {CHANGE_STATUS_BOX +4 =+0 +124 +26 upkeep   units-box-topright}
        {CHANGE_STATUS_BOX +4 =+0 +96 +26 income   upkeep-box-topright}
        {CHANGE_STATUS_BOX +4 =+0 +100 +26 battery  income-box-topright}
#define _WN_STATUS_ICON ID WIDTH
    [change]
        id={ID}
        rect="=+1,=+1,+{WIDTH},+24"
    [/change]
#enddef
        {_WN_STATUS_ICON icon-sideplaying 34}
        {_WN_STATUS_ICON gold-icon 24}
        {_WN_STATUS_ICON villages-icon 24}
        {_WN_STATUS_ICON units-icon 24}
        {_WN_STATUS_ICON upkeep-icon 35}
        {_WN_STATUS_ICON income-icon 35}
#undef _WN_STATUS_ICON
#define _WN_STATUS_FONT ID WIDTH
    [change]
        id={ID}
        font_size=20
        rect="+4,=-1,+{WIDTH},+26"
    [/change]
#enddef
        {_WN_STATUS_FONT turn 80}
