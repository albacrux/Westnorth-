#textdomain wesnoth-lib
###
### Westnorth: recruit dialog for phones (docs/westnorth/redesenho-combate.md,
### prototype docs/westnorth/prototipos/3-recrutar.jpg): full screen, the units
### as a grid of cards (art, name, cost) with the details of the selected one
### beside it. Same C++ as units_dialog (units_dialog::build_recruit_dialog
### asks for this window); widgets it does not use for recruiting stay hidden.
###

#define _WN_RECRUIT_CARDS
[grid_listbox]
	id = "main_list"
	definition = "default"
	horizontal_scrollbar_mode = "never"

	[list_definition]
		[row]
			[column]
				[toggle_panel]
					id = "row_panel"
					definition = "default"
					linked_group = "card"
					return_value_id = "ok"

					[grid]
						# Cards at least 280 px wide, so they wrap into rows.
						[row]
							[column]
								[spacer]
									width = 280
								[/spacer]
							[/column]
						[/row]
						[row]
							[column]
								border = "left,right"
								border_size = 10
								horizontal_alignment = "center"
								[image]
									id = "unit_image"
									definition = "default"
								[/image]
							[/column]
						[/row]
						[row]
							[column]
								border = "all"
								border_size = 8
								horizontal_alignment = "center"
								[rich_label]
									id = "unit_details"
									definition = "default"
									text_alignment = "center"
									link_aware = false
								[/rich_label]
							[/column]
						[/row]
					[/grid]
				[/toggle_panel]
			[/column]
		[/row]
	[/list_definition]
[/grid_listbox]
#enddef

[window]
	id = "westnorth_recruit"
	description = "Westnorth: recruit dialog with unit cards (same C++ as units_dialog)."

	[resolution]
		definition = "default"
		{GUI_WINDOW_FULLSCREEN}

		[linked_group]
			id = "card"
			fixed_width = true
			fixed_height = true
		[/linked_group]

		[linked_group]
			id = "favorite"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "image"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "name"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "type"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "level"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "moves"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hitpoints"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "experience"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "status"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "traits"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0

				[column]
					horizontal_grow = true

					[grid]

						[row]

							[column]
								grow_factor = 1
								border = "all"
								border_size = 5
								horizontal_alignment = "left"

								[label]
									definition = "title"
									id = "title"
								[/label]

							[/column]

							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								[text_box]
									id = "filter_box"
									definition = "default"
									{FILTER_TEXT_BOX_HINT}
									tooltip = _ "Search for unit name, unit type name, unit level, or trait"
								[/text_box]

							[/column]

						[/row]

					[/grid]

				[/column]

			[/row]

			[row]
				grow_factor = 1

				[column]
					horizontal_grow = true
					vertical_grow = true

					[grid]

						[row]
							grow_factor = 1

							[column]
								grow_factor = 0
								vertical_grow = true
								border = "all"
								border_size = 5

								[unit_preview_pane]
									definition = "default"
									id = "unit_details"
								[/unit_preview_pane]

							[/column]

							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true

								[grid]

									[row]
										grow_factor = 1

										[column]
											grow_factor = 1
											border = "all"
											border_size = 5
											horizontal_grow = true
											vertical_grow = true

											{_WN_RECRUIT_CARDS}
										[/column]

									[/row]

								[/grid]

							[/column]

						[/row]

					[/grid]

				[/column]

			[/row]

			[row]
				grow_factor=0

				[column]
					horizontal_grow = true

					[grid]
						id = "variation_gender_grid"
						[row]
							[column]
								horizontal_alignment = "left"
								[grid]
									[row]

										[column]
											border = "all"
											border_size = 5

											[toggle_button]
												id = "male_toggle"
												definition = "radio"
												label= _ "Male"
											[/toggle_button]
										[/column]

										[column]
											border = "all"
											border_size = 5

											[toggle_button]
												id = "female_toggle"
												definition = "radio"
												label= _ "Female"
											[/toggle_button]

										[/column]

									[/row]
								[/grid]
							[/column]

							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								[menu_button]
									id = "variation_box"
									definition = "default"
								[/menu_button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 0
					horizontal_alignment = "right"
					[grid]
						[row]
							grow_factor = 0

							[column]
								grow_factor = 0
								border = "all"
								border_size = 5
								[button]
									id = "dismiss"
									definition = "default"
									label = _ "Dismiss"
								[/button]
							[/column]

							[column]
								grow_factor = 1
								border = "all"
								border_size = 5
								[button]
									id = "rename"
									definition = "default"
									label = _ "Rename"
								[/button]
							[/column]

							[column]
								grow_factor = 1
								border = "all"
								border_size = 5
								[button]
									id = "mark_favorite"
									definition = "default"

									#po: Filled five pointed star, used as favorite unit marker
									label = _ "★"
									tooltip = _ "Mark/unmark the selected unit as favorite"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 0
					horizontal_grow = true
					[grid]
						[row]
							grow_factor=0

							[column]
								grow_factor = 1
								border = "all"
								border_size = 5
								horizontal_alignment = "left"
								[button]
									id = "show_help"
									definition = "help"
								[/button]
							[/column]

							[column]
								grow_factor = 0
								border = "all"
								border_size = 5
								horizontal_alignment = "right"
								[button]
									id = "ok"
									definition = "touch"
								[/button]
							[/column]

							# Westnorth: keep Cancel away from the main action on touch screens
							[column]
								grow_factor = 0
								[spacer]
									width = 32
								[/spacer]
							[/column]

							[column]
								grow_factor = 0
								border = "all"
								border_size = 5
								horizontal_alignment = "right"
								[button]
									id = "cancel"
									definition = "touch"
									label = _ "Cancel"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]

			[/row]

		[/grid]

	[/resolution]

[/window]

#undef _WN_RECRUIT_CARDS
