#textdomain wesnoth-lib
###
### Definition of the window to choose a unit's advancement.
###
### Westnorth: phone layout (docs/westnorth/prototipos/4-evolucao.jpg): full
### screen, one card per advancement side by side, each with the art, the new
### unit type and what it brings (HP, moves, attacks). Tap a card to choose it,
### tap it again or press OK to confirm. Filled by src/gui/dialogs/unit_advance.cpp.
###

#define _GUI_ADVANCE_LIST
	[horizontal_listbox]
		id = "advance_choice"
		definition = "default"
		horizontal_scrollbar_mode = "auto"
		vertical_scrollbar_mode = "never"

		[list_definition]
			[row]
				[column]
					vertical_grow = true
					horizontal_grow = true

					[toggle_panel]
						definition = "default"
						linked_group = "card"

						return_value_id = "ok"
						[grid]
							# Cards at least 340 px wide.
							[row]
								[column]
									[spacer]
										width = 340
									[/spacer]
								[/column]
							[/row]
							[row]
								[column]
									border = "left,right,top"
									border_size = 10
									horizontal_alignment = "center"
									[image]
										id = "advancement_image"
										definition = "default"
									[/image]
								[/column]
							[/row]
							[row]
								[column]
									border = "left,right"
									border_size = 14
									horizontal_alignment = "left"
									[label]
										id = "advancement_name"
										definition = "title"
										use_markup = true
									[/label]
								[/column]
							[/row]
							[row]
								grow_factor = 1
								[column]
									border = "all"
									border_size = 14
									horizontal_alignment = "left"
									vertical_alignment = "top"
									[label]
										id = "wn_advancement_stats"
										definition = "default"
										use_markup = true
									[/label]
								[/column]
							[/row]
						[/grid]
					[/toggle_panel]
				[/column]
			[/row]
		[/list_definition]
	[/horizontal_listbox]
#enddef

[window]
	id = "unit_advance"
	description = "Unit advancement dialog"

	[resolution]
		definition = "default"

		{GUI_WINDOW_FULLSCREEN}

		[linked_group]
			id = "card"
			fixed_width = true
			fixed_height = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]

			[row]
				[column]
					border = "all"
					border_size = 10
					horizontal_alignment = "center"
					[label]
						definition = "title"
						label = _ "Advance Unit"
					[/label]
				[/column]
			[/row]

			[row]
				[column]
					border = "left,right,bottom"
					border_size = 10
					horizontal_alignment = "center"
					[label]
						definition = "default"
						label = _ "What should our victorious unit become?"
					[/label]
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					border = "all"
					border_size = 10
					horizontal_alignment = "center"
					vertical_alignment = "center"
					{_GUI_ADVANCE_LIST}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					[grid]
						[row]
							[column]
								grow_factor = 1
								border = "all"
								border_size = 10
								horizontal_alignment = "left"
								[button]
									id = "show_help"
									definition = "help"
								[/button]
							[/column]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"
								[button]
									id = "ok"
									definition = "touch"
									label = _ "OK"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

		[/grid]

	[/resolution]

[/window]

#undef _GUI_ADVANCE_LIST
