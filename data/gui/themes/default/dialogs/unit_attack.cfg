#textdomain wesnoth-lib
###
### Definition of the window select which unit to attack
###

#define _GUI_BIG_WEAPON_PANEL
[grid]

	[row]

		[column]
			horizontal_grow = true
			border = "all"
			border_size = 5

			[listbox]
				id = "weapon_list"
				definition = "default"
				horizontal_scrollbar_mode = "never"

				[list_definition]

					[row]

						[column]
							vertical_grow = true
							horizontal_grow = true

							[toggle_panel]
								definition = "default"

								return_value_id = "ok"
								[grid]

									[row]
										grow_factor = 1

										[column]
											grow_factor = 0
											horizontal_alignment = "left"

											border = "all"
											border_size = 5

											[image]
												id = "attacker_weapon_icon"
												definition = "default"
											[/image]

										[/column]

										[column]
											grow_factor = 1
											horizontal_alignment = "left"
											vertical_alignment = "center"

											border = "all"
											border_size = 5

											[label]
												id = "attacker_weapon"
												definition = "default_small"
												linked_group = "weapon"
												characters_per_line = 25
											[/label]

										[/column]

										[column]
											grow_factor = 0
											horizontal_alignment = "center"
											vertical_alignment = "center"

											border = "all"
											border_size = 5

											[label]
												id = "range"
												definition = "default"

												text_alignment = "center"
											[/label]

										[/column]

										[column]
											grow_factor = 1
											horizontal_alignment = "right"
											vertical_alignment = "center"

											border = "all"
											border_size = 5

											[label]
												id = "defender_weapon"
												definition = "default_small"
												linked_group = "weapon"

												text_alignment = "right"
												characters_per_line = 25
											[/label]

										[/column]

										[column]
											grow_factor = 0
											horizontal_alignment = "right"
											border = "all"
											border_size = 5

											[image]
												id = "defender_weapon_icon"
												definition = "default"
											[/image]

										[/column]

									[/row]

								[/grid]

							[/toggle_panel]

						[/column]

					[/row]

				[/list_definition]

			[/listbox]

		[/column]

	[/row]

[/grid]
#enddef

# Westnorth: "duel" layout for phones (docs/westnorth/prototipos/2-ataque.jpg):
# full screen, attacker and defender with big portraits on the sides, their HP
# now -> expected after the fight, the weapon list in the middle and the odds of
# killing and of dying. Filled by src/gui/dialogs/unit_attack.cpp.
#define _WN_SIDE SIDE ALIGN
[grid]
	[row]
		[column]
			horizontal_alignment = {ALIGN}
			[image]
				id = "wn_{SIDE}_portrait"
				definition = "default"
			[/image]
		[/column]
	[/row]
	[row]
		[column]
			horizontal_alignment = {ALIGN}
			border = "top"
			border_size = 4
			[label]
				id = "wn_{SIDE}_name"
				definition = "title"
			[/label]
		[/column]
	[/row]
	[row]
		[column]
			horizontal_alignment = {ALIGN}
			[label]
				id = "wn_{SIDE}_info"
				definition = "default_small"
				use_markup = true
			[/label]
		[/column]
	[/row]
	[row]
		[column]
			horizontal_alignment = {ALIGN}
			border = "top"
			border_size = 8
			[label]
				id = "wn_{SIDE}_hp"
				definition = "default"
				use_markup = true
			[/label]
		[/column]
	[/row]
	[row]
		[column]
			horizontal_alignment = {ALIGN}
			border = "top"
			border_size = 4
			[image]
				id = "wn_{SIDE}_hp_bar"
				definition = "default"
			[/image]
		[/column]
	[/row]
[/grid]
#enddef

#define _WN_ODDS ID
[column]
	grow_factor = 1
	horizontal_grow = true
	border = "all"
	border_size = 8
	[label]
		id = "{ID}"
		definition = "default"
		text_alignment = "center"
		use_markup = true
	[/label]
[/column]
#enddef

[window]
	id = "unit_attack"
	description = "Unit attack dialog."

	[resolution]
		definition = "default"

		{GUI_WINDOW_FULLSCREEN}

		# All weapons share the same size, regardless whether attacker or
		# defender.
		[linked_group]
			id = "weapon"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip_transparent"
		[/tooltip]

		[helptip]
			id = "tooltip_transparent"
		[/helptip]

		[grid]

			[row]
				[column]
					grow_factor = 1
					horizontal_grow = true
					[grid]
						[row]
							[column]
								grow_factor = 1
								border = "all"
								border_size = 5
								horizontal_alignment = "left"
								[label]
									definition = "title"
									label = _ "Attack Enemy"
								[/label]
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"
								[button]
									id = "damage_calculation"
									definition = "default"
									label = _ "Damage Calculation"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true
					[grid]
						[row]
							[column]
								border = "left,right"
								border_size = 20
								vertical_alignment = "bottom"
								{_WN_SIDE attacker "left"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_alignment = "center"
								[grid]
									[row]
										[column]
											horizontal_grow = true
											{_GUI_BIG_WEAPON_PANEL}
										[/column]
									[/row]
									[row]
										[column]
											horizontal_grow = true
											[grid]
												[row]
													{_WN_ODDS wn_kill}
													{_WN_ODDS wn_death}
												[/row]
											[/grid]
										[/column]
									[/row]
								[/grid]
							[/column]
							[column]
								border = "left,right"
								border_size = 20
								vertical_alignment = "bottom"
								{_WN_SIDE defender "right"}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					[grid]
						[row]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "left"
								[button]
									id = "cancel"
									definition = "touch"
									label = _ "Cancel"
								[/button]
							[/column]
							[column]
								grow_factor = 1
								[spacer]
								[/spacer]
							[/column]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"
								[button]
									id = "ok"
									definition = "touch"
									label = _ "Attack"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

		[/grid]

	[/resolution]

[/window]

#undef _WN_SIDE
#undef _WN_ODDS
#undef _GUI_BIG_WEAPON_PANEL
