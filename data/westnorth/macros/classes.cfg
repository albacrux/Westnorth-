#textdomain wesnoth-westnorth

# Westnorth: put the job class system into a scenario or era.
# Loads the Lua module on every (re)load and adds the "Mudar de classe..."
# entry to the context menu (long press on a unit on touch screens).
#define WN_CLASS_SYSTEM
    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<<
                wesnoth.dofile "westnorth/lua/classes.lua"
                wesnoth.dofile("westnorth/lua/achievements.lua").register_events()
            >>
        [/lua]
    [/event]
    [event]
        name=prestart
        [set_menu_item]
            id=westnorth_change_class
            description= _ "Mudar de classe..."
            image=icons/action/editor-tool-unit_25.png
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                    [filter_location]
                        terrain=*^V*,C*,K*,C*^*,K*^*
                    [/filter_location]
                    [and]
                        lua_function=westnorth_is_class_unit
                    [/and]
                [/have_unit]
            [/show_if]
            [command]
                [lua]
                    code=<< westnorth_classes.menu_change_class(wml.variables.x1, wml.variables.y1) >>
                [/lua]
            [/command]
        [/set_menu_item]
    [/event]
#enddef

# Westnorth: console line with each game's result, read by utils/westnorth/balance.py.
#define WN_RESULT_REPORT
    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<< wesnoth.dofile "westnorth/lua/report.lua" >>
        [/lua]
    [/event]
#enddef
