#textdomain wesnoth-westnorth

# Westnorth: put the job class system into a scenario or era.
# Loads the Lua module on every (re)load and adds the "Mudar de classe..."
# entry to the context menu (long press on a unit on touch screens).
#define WN_CLASS_SYSTEM
    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<<
                wesnoth.dofile "westnorth/lua/classes.lua"
                wesnoth.dofile("westnorth/lua/achievements.lua").register_events()
            >>
        [/lua]
    [/event]
    [event]
        name=prestart
        [lua]
            code=<< westnorth_classes.add_menu_item() >>
        [/lua]
    [/event]
#enddef

# Westnorth: console line with each game's result, read by utils/westnorth/balance.py.
#define WN_RESULT_REPORT
    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<< wesnoth.dofile "westnorth/lua/report.lua" >>
        [/lua]
    [/event]
#enddef
