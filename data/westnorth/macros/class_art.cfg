#textdomain wesnoth-westnorth

# Westnorth: art of the job classes (docs/westnorth/plano-sprites.md). The
# sprites (units/westnorth/STEM*.png, 72x72 with @2x versions) are made and
# checked on the owner's desktop: figure 70-80% of the hex height, feet at
# y=58/72, magenta team color. Frames per class: STEM (standing),
# STEM-defend-[1,2] and STEM-attack-[1~3]. The classes use
# [base_unit] inherit_animations=no, so nothing from the upstream unit's art
# is left behind (death and movement use the engine's default animations).

# Standing image, with the class seal (icons/classes/seal-SEAL.png, 20x20)
# near the hex's right edge so the job reads at a glance on the phone
# (plano-sprites.md, lever D), and the defense animation.
#define WN_ART STEM SEAL
    image="units/westnorth/{STEM}.png~BLIT(icons/classes/seal-{SEAL}.png,50,12)"
    {DEFENSE_ANIM "units/westnorth/{STEM}-defend-2.png" "units/westnorth/{STEM}-defend-1.png" {SOUND_LIST:HUMAN_HIT}}
#enddef

# Melee attacks (any weapon with range=melee).
#define WN_ART_MELEE STEM HIT_SOUND MISS_SOUND
    [attack_anim]
        [filter_attack]
            range=melee
        [/filter_attack]
        start_time=-250
        [frame]
            image="units/westnorth/{STEM}-attack-[1~3].png:[100,150,100]"
        [/frame]
        {SOUND:HIT_AND_MISS {HIT_SOUND} {MISS_SOUND} -100}
    [/attack_anim]
#enddef

# A ranged attack by weapon name, with its missile (a [missile_frame] or one
# of the core MISSILE_FRAME_* / MAGIC_MISSILE macros).
#define WN_ART_RANGED STEM WEAPON MISSILE HIT_SOUND MISS_SOUND
    [attack_anim]
        [filter_attack]
            name={WEAPON}
        [/filter_attack]
        {MISSILE}
        start_time=-450
        [frame]
            image="units/westnorth/{STEM}-attack-[1~3].png:[150,150,150]"
        [/frame]
        {SOUND:HIT_AND_MISS {HIT_SOUND} {MISS_SOUND} -150}
    [/attack_anim]
#enddef

# Straight-flying projectile (arrow, bolt, javelin, knife).
#define WN_MISSILE PROJECTILE
    [missile_frame]
        begin=-150
        end=0
        image="projectiles/{PROJECTILE}-n.png"
        image_diagonal="projectiles/{PROJECTILE}-ne.png"
    [/missile_frame]
#enddef
