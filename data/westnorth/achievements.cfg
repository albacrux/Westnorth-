#textdomain wesnoth-westnorth

# Westnorth: achievements of the job class system (roadmap M5).
# Awarded by data/westnorth/lua/achievements.lua, only to the local human player.

[achievement_group]
    display_name= _ "Westnorth: Classes"
    content_for=westnorth

    [achievement]
        id=WN_first_change
        name= _ "Nova Vocação"
        name_completed= _ "Nova Vocação"
        description= _ "Mudar a classe de uma unidade pela primeira vez."
        description_completed= _ "Mudou a classe de uma unidade."
        icon="icons/achievements/ach-class-change.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_all_classes
        name= _ "Mestre de Todos os Ofícios"
        name_completed= _ "Mestre de Todos os Ofícios"
        description= _ "Ter em seu exército, por recrutamento ou troca, cada uma das 6 classes do Westnorth."
        description_completed= _ "Usou todas as 6 classes do Westnorth."
        icon="icons/achievements/ach-master-all.png~SCALE(72,72)"
        [sub_achievement]
            id=squire
            description= _ "Escudeiro"
            icon="icons/classes/seal-squire@2x.png~SCALE(36,36)"
        [/sub_achievement]
        [sub_achievement]
            id=knight
            description= _ "Cavaleiro"
            icon="icons/classes/seal-knight@2x.png~SCALE(36,36)"
        [/sub_achievement]
        [sub_achievement]
            id=archer
            description= _ "Arqueiro"
            icon="icons/classes/seal-archer@2x.png~SCALE(36,36)"
        [/sub_achievement]
        [sub_achievement]
            id=thief
            description= _ "Ladino"
            icon="icons/classes/seal-thief@2x.png~SCALE(36,36)"
        [/sub_achievement]
        [sub_achievement]
            id=whitemage
            description= _ "Mago Branco"
            icon="icons/classes/seal-white-mage@2x.png~SCALE(36,36)"
        [/sub_achievement]
        [sub_achievement]
            id=blackmage
            description= _ "Mago Negro"
            icon="icons/classes/seal-black-mage@2x.png~SCALE(36,36)"
        [/sub_achievement]
    [/achievement]

    [achievement]
        id=WN_promotion
        name= _ "Promovido"
        name_completed= _ "Promovido"
        description= _ "Levar uma unidade de classe ao nível 2."
        description_completed= _ "Levou uma unidade de classe ao nível 2."
        icon="icons/achievements/ach-evolution.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_veteran_change
        name= _ "Segunda Carreira"
        name_completed= _ "Segunda Carreira"
        description= _ "Mudar a classe de uma unidade de nível 2."
        description_completed= _ "Mudou a classe de um veterano."
        icon="icons/achievements/ach-tactician.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_slow_10
        name= _ "Freio de Mão"
        name_completed= _ "Freio de Mão"
        description= _ "Acertar 10 golpes de Cavaleiro (que deixam o alvo lento)."
        description_completed= _ "Acertou 10 golpes de Cavaleiro."
        icon="icons/achievements/ach-cavalry.png~SCALE(72,72)"
        max_progress=10
    [/achievement]

    [achievement]
        id=WN_backstab
        name= _ "Pelas Costas"
        name_completed= _ "Pelas Costas"
        description= _ "Derrotar um inimigo com um Ladino ou uma Sombra."
        description_completed= _ "Derrotou um inimigo com um Ladino ou uma Sombra."
        icon="icons/achievements/ach-stealth.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_dark_magic
        name= _ "Magia Negra"
        name_completed= _ "Magia Negra"
        description= _ "Derrotar um inimigo com um Mago Negro ou um Feiticeiro Sombrio."
        description_completed= _ "Derrotou um inimigo com magia negra."
        icon="icons/achievements/ach-arcane.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_win_crossroads
        name= _ "Senhor da Encruzilhada"
        name_completed= _ "Senhor da Encruzilhada"
        description= _ "Vencer no mapa <i>2p — Encruzilhada (Westnorth)</i>."
        description_completed= _ "Venceu na Encruzilhada."
        icon="icons/achievements/ach-first-victory.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_flawless
        name= _ "Sem Baixas"
        name_completed= _ "Sem Baixas"
        description= _ "Vencer uma partida com classes do Westnorth sem perder nenhuma unidade."
        description_completed= _ "Venceu sem perder nenhuma unidade."
        icon="icons/achievements/ach-flawless.png~SCALE(72,72)"
    [/achievement]

    [achievement]
        id=WN_blitz
        name= _ "Guerra Relâmpago"
        name_completed= _ "Guerra Relâmpago"
        description= _ "Vencer uma partida com classes do Westnorth em até 12 turnos."
        description_completed= _ "Venceu em até 12 turnos."
        icon="icons/achievements/ach-speedrun.png~SCALE(72,72)"
    [/achievement]
[/achievement_group]
