#textdomain wesnoth-westnorth

# Westnorth: achievements of the job class system (roadmap M5).
# Awarded by data/westnorth/lua/achievements.lua, only to the local human player.

[achievement_group]
    display_name= _ "Westnorth: Classes"
    content_for=westnorth

    [achievement]
        id=WN_first_change
        name= _ "Nova Vocação"
        name_completed= _ "Nova Vocação"
        description= _ "Mudar a classe de uma unidade pela primeira vez."
        description_completed= _ "Mudou a classe de uma unidade."
        icon="attacks/blank-attack.png~SCALE(72,72)~BLIT(units/human-loyalists/spearman.png~RC(magenta>red), 0, 0)~BLIT(misc/achievement-frame-mp.png, 0, 0)"
    [/achievement]

    [achievement]
        id=WN_all_classes
        name= _ "Mestre de Todos os Ofícios"
        name_completed= _ "Mestre de Todos os Ofícios"
        description= _ "Ter em seu exército, por recrutamento ou troca, cada uma das 6 classes do Westnorth."
        description_completed= _ "Usou todas as 6 classes do Westnorth."
        icon="attacks/blank-attack.png~SCALE(72,72)~BLIT(units/human-magi/white-mage.png~RC(magenta>red), 0, 0)~BLIT(misc/achievement-frame-mp.png, 0, 0)"
