#textdomain wesnoth-westnorth

# Westnorth: prototype era with the round-1 job classes (docs/westnorth/classes.md).

[era]
    id=westnorth_classes
    name= _ "Westnorth: Classes (protótipo)"
    description= _ "Duas facções formadas pelas classes do Westnorth. Toque e segure uma unidade sobre uma vila ou castelo para mudar a classe dela. Protótipo: equilíbrio ainda não testado."
    type=mp
    require_era=yes

    [multiplayer_side]
        id=WN_Crown
        name= _ "Ordem da Coroa"
        image="units/human-loyalists/pikeman.png"
        type=random
        leader=WN_Squire2,WN_Knight2,WN_WhiteMage2
        random_leader=WN_Squire2,WN_Knight2,WN_WhiteMage2
        recruit=WN_Squire,WN_Knight,WN_Archer,WN_WhiteMage
        terrain_liked=Gg,Hh
        description= _ "A <b>Ordem da Coroa</b> forma linhas firmes de Escudeiros, flanqueia com Cavaleiros e cura com Magos Brancos."
        [ai]
            recruitment_pattern=fighter,fighter,scout,archer,healer
        [/ai]
    [/multiplayer_side]

    [multiplayer_side]
        id=WN_Shadow
        name= _ "Companhia Sombria"
        image="units/human-outlaws/rogue.png"
        type=random
        leader=WN_Thief2,WN_BlackMage2,WN_Archer2
        random_leader=WN_Thief2,WN_BlackMage2,WN_Archer2
        recruit=WN_Thief,WN_BlackMage,WN_Archer,WN_Squire
        terrain_liked=Gs^Fds,Hh
        description= _ "A <b>Companhia Sombria</b> infiltra Ladinos entre as linhas inimigas e destrói alvos com a magia dos Magos Negros."
        [ai]
            recruitment_pattern=scout,mixed fighter,archer,fighter
        [/ai]
    [/multiplayer_side]

    {WN_CLASS_SYSTEM}
[/era]
