#textdomain wesnoth-westnorth

# Westnorth: small 2-player map sized for a phone in landscape (22x12 hexes).

[multiplayer]
    id=westnorth_2p_encruzilhada
    name= _ "2p — Encruzilhada (Westnorth)"
    description= _ "Um rio divide o campo; dois vaus decidem a batalha. Mapa pequeno, pensado para jogar no celular."
    map_file=westnorth/maps/2p_Encruzilhada.map
    random_start_time=yes
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    {WN_RESULT_REPORT}

    [side]
        side=1
        canrecruit=yes
        controller=human
        team_name=west
        user_team_name= _ "teamname^Oeste"
        fog=yes
    [/side]

    [side]
        side=2
        canrecruit=yes
        controller=human
        team_name=east
        user_team_name= _ "teamname^Leste"
        fog=yes
    [/side]
[/multiplayer]
