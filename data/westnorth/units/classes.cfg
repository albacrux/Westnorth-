#textdomain wesnoth-westnorth

# Westnorth: round 1 of the job classes (docs/westnorth/classes.md).
#
# Each class has two levels. Stats come from upstream units via [base_unit];
# sprites, animations (macros/class_art.cfg) and portraits are the fork's own,
# so the base's art is not inherited (inherit_animations=no).
# [base_unit] merges child tags by position, so an [attack] here patches the
# base unit's attack with the same index, and [specials]/[abilities] are added
# to what the base already has.
#
# Design rule: every class must change what the player *does*, not only numbers.
#   Escudeiro   holds the line (steadfast) and, at level 2, leads (leadership)
#   Cavaleiro   fast rider whose blows slow the target (halves its damage)
#   Arqueiro    precise ranged fire (marksman: 60% to hit at least)
#   Ladino      slips through enemy lines (skirmisher) and backstabs
#   Mago Branco heals adjacent allies; arcane damage against the undead
#   Mago Negro  fragile, no melee, strong magical ranged attacks

#define WN_CLASS_DESCRIPTION_FOOTER
    "

" + _ "<i>Classe do Westnorth. Toque e segure a unidade sobre uma vila ou castelo para mudar de classe; ela mantém experiência e traços.</i>"#enddef

# --- Escudeiro ---------------------------------------------------------------

[unit_type]
    id=WN_Squire
    name= _ "Escudeiro"
    [base_unit]
        id=Spearman
        inherit_animations=no
    [/base_unit]
    {WN_ART squire}
    profile="portraits/westnorth/squire.png"
    {WN_ART_MELEE squire spear.ogg spear-miss.ogg}
    {WN_ART_RANGED squire javelin ({WN_MISSILE spear}) spear.ogg spear-miss.ogg}
    advances_to=WN_Squire2
    cost=14
    experience=40
    description= _ "O Escudeiro é o soldado que não recua: firme na defesa, segura a linha enquanto as outras classes manobram." + {WN_CLASS_DESCRIPTION_FOOTER}
    [abilities]
        {WN_SEAL squire}
        {ABILITY_STEADFAST}
    [/abilities]
    [attack]
        icon="attacks/westnorth/spear-pike.png"
    [/attack]
    [attack]
    [/attack]
[/unit_type]

[unit_type]
    id=WN_Squire2
    name= _ "Guardião"
    [base_unit]
        id=Pikeman
        inherit_animations=no
    [/base_unit]
    {WN_ART guardian}
    profile="portraits/westnorth/guardian.png"
    {WN_ART_MELEE guardian spear.ogg spear-miss.ogg}
    advances_to=null
    {AMLA_DEFAULT}
    cost=26
    description= _ "O Guardião segura a linha e inspira os soldados ao redor, que lutam melhor ao seu lado." + {WN_CLASS_DESCRIPTION_FOOTER}
    [abilities]
        {WN_SEAL squire}
        {ABILITY_STEADFAST}
        {ABILITY_LEADERSHIP}
    [/abilities]
    [attack]
        icon="attacks/westnorth/spear-pike.png"
    [/attack]
[/unit_type]

# --- Cavaleiro ---------------------------------------------------------------

[unit_type]
    id=WN_Knight
    name= _ "Cavaleiro"
    [base_unit]
        id=Cavalryman
        inherit_animations=no
    [/base_unit]
    {WN_ART knight}
    profile="portraits/westnorth/knight.png"
    {WN_ART_MELEE knight ({SOUND_LIST:SWORD_SWISH}) ({SOUND_LIST:MISS})}
    advances_to=WN_Knight2
    cost=18
    experience=40
    description= _ "O Cavaleiro atravessa o campo rápido e acerta para desequilibrar: o alvo atingido fica lento e causa metade do dano até o fim do turno." + {WN_CLASS_DESCRIPTION_FOOTER}
    [attack]
        damage=5
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [abilities]
        {WN_SEAL knight}
    [/abilities]
[/unit_type]

[unit_type]
    id=WN_Knight2
    name= _ "Cavaleiro Rúnico"
    [base_unit]
        id=Dragoon
        inherit_animations=no
