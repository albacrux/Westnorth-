    cost=32
    description= _ "O Sacerdote da Luz cura muito e remove veneno dos aliados ao seu lado." + {WN_CLASS_DESCRIPTION_FOOTER}
[/unit_type]

# --- Mago Negro ---------------------------------------------------------------

[unit_type]
