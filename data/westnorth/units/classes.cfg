    name= _ "Arqueiro"
    [base_unit]
        id=Bowman
    [/base_unit]
    advances_to=WN_Archer2
    cost=16
    experience=40
    description= _ "O Arqueiro escolhe o alvo e acerta: ao atacar com o arco, tem pelo menos 60% de chance de acerto, mesmo contra inimigos em boa defesa." + {WN_CLASS_DESCRIPTION_FOOTER}
    [attack]
    [/attack]
    [attack]
        damage=5
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]
[/unit_type]

[unit_type]
    id=WN_Archer2
    name= _ "Atirador de Elite"
    [base_unit]
        id=Longbowman
    [/base_unit]
    advances_to=null
    {AMLA_DEFAULT}
    cost=27
    description= _ "O Atirador de Elite derruba alvos protegidos por florestas e muralhas." + {WN_CLASS_DESCRIPTION_FOOTER}
    [attack]
    [/attack]
    [attack]
        damage=9
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]
[/unit_type]

# --- Ladino ------------------------------------------------------------------

[unit_type]
    id=WN_Thief
    name= _ "Ladino"
    [base_unit]
        id=Thief
    [/base_unit]
    advances_to=WN_Thief2
    cost=14
    experience=36
    description= _ "O Ladino passa entre os inimigos sem ser detido e ataca pelas costas, causando dano dobrado quando um aliado está do outro lado do alvo." + {WN_CLASS_DESCRIPTION_FOOTER}
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
[/unit_type]

[unit_type]
    id=WN_Thief2
    name= _ "Sombra"
    [base_unit]
        id=Rogue
    [/base_unit]
    advances_to=null
    {AMLA_DEFAULT}
    cost=26
    description= _ "A Sombra envenena as facas que arremessa: o alvo perde vida a cada turno até ser curado numa vila ou por um curandeiro." + {WN_CLASS_DESCRIPTION_FOOTER}
    [attack]
    [/attack]
    [attack]
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
[/unit_type]

# --- Mago Branco -------------------------------------------------------------

[unit_type]
    id=WN_WhiteMage
    name= _ "Mago Branco"
    [base_unit]
        id=Mage
    [/base_unit]
    advances_to=WN_WhiteMage2
