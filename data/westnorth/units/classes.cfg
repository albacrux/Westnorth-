[/unit_type]

[unit_type]
    id=WN_BlackMage2
    name= _ "Feiticeiro Sombrio"
    [base_unit]
        id=Dark Sorcerer
    [/base_unit]
    advances_to=null
    {AMLA_DEFAULT}
    cost=34
    description= _ "O Feiticeiro Sombrio domina o frio e as sombras, e já consegue se defender com o cajado." + {WN_CLASS_DESCRIPTION_FOOTER}
[/unit_type]

#undef WN_CLASS_DESCRIPTION_FOOTER
