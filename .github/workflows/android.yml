name: Android

# Westnorth: builds the arm64 debug APK and the game-data packages, and publishes
# both to the "nightly" GitHub release so they can be installed from the phone.
# See CLAUDE.md ("Android") and packaging/android/westnorth/make-data-packages.sh.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-nightly
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Upstream snapshot the "core" data package is built from. Bump CORE_GEN
  # whenever the snapshot is replaced, so phones download the new core.
  CORE_REF: c3a225dd5eba42277008dd7c2b87d287efb801ed
  CORE_GEN: 2
  GH_REPO: ${{ github.repository }}

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Install gettext and zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext zip
      - name: Core data package (only when missing)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "core-data-$CORE_GEN" >/dev/null 2>&1; then
            echo "core-data-$CORE_GEN already published"
          else
            packaging/android/westnorth/make-data-packages.sh core out
            # Create the tag first: release creation then never depends on --target.
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/core-data-$CORE_GEN" -f sha="$CORE_REF" || true
            gh release create "core-data-$CORE_GEN" out/core.zip --prerelease --verify-tag \
              --title "Core data $CORE_GEN" \
              --notes "Upstream Wesnoth data at $CORE_REF, used by the Android app. Do not delete."
          fi
      - name: Patch package and manifest
        env: { BUILD: "${{ github.run_number }}" }
        run: |
          packaging/android/westnorth/make-data-packages.sh patch out
          packaging/android/westnorth/make-data-packages.sh manifest out
      - uses: actions/upload-artifact@v7
        with:
          name: data-packages
          path: |
            out/patch.zip
            out/manifest.txt

  apk:
    runs-on: ubuntu-latest
    container: wesnoth/wesnoth:android
    env:
      API: 23
      ARCHS: arm64-v8a
      WESTNORTH_BUILD: ${{ github.run_number }}
      BUILDBASEDIR: ${{ github.workspace }}/packaging/android
      PREFIXDIR: ${{ github.workspace }}/packaging/android/prefix
    steps:
      - { uses: actions/checkout@v6, with: { submodules: "recursive" } }
      - name: Set git safe directory
        run: git config --global --add safe.directory '*'
      - name: Restore dependencies cache
        id: restore-deps-cache
        uses: actions/cache/restore@v5
        with:
          key: westnorth-android-deps-arm64-${{ hashFiles('packaging/android/build-android-dependencies/*') }}
          path: ${{ env.PREFIXDIR }}
      - name: Build dependencies
        if: steps.restore-deps-cache.outputs.cache-hit != 'true'
        env:
          DOWNLOADDIR: ${{ env.BUILDBASEDIR }}/download
          BUILDDIR: ${{ env.BUILDBASEDIR }}/build
        run: cd packaging/android && chmod +x ./gradlew && ./gradlew buildCppDepends
      - name: Save dependencies cache
        if: steps.restore-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.restore-deps-cache.outputs.cache-primary-key }}
          path: ${{ env.PREFIXDIR }}
      - name: Build Wesnoth and debug APK
        run: cd packaging/android && chmod +x ./gradlew && ./gradlew buildCppSource assembleDebug
      - name: Rename APK
        run: cp packaging/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk westnorth-arm64-v8a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: westnorth-arm64-v8a.apk
          path: westnorth-arm64-v8a.apk

  publish:
    needs: [ data, apk ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with: { path: dl, merge-multiple: true }
      - name: Publish to the nightly release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dl
          notes="Build ${{ github.run_number }} from ${{ github.sha }}.

          Instalar no celular: baixe westnorth-arm64-v8a.apk e abra.
          Os dados do jogo (core + patch) são baixados pelo próprio app ao abrir."
          if ! gh release view nightly >/dev/null 2>&1; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="${{ github.sha }}" || true
            gh release create nightly --prerelease --verify-tag --title "Westnorth nightly" --notes "$notes"
          else
            # Move the tag so the release page shows the commit the files came from.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="${{ github.sha }}" -F force=true || true
            gh release edit nightly --notes "$notes"
          fi
          # Upload the data first, the manifest last, so a phone never sees a
          # manifest that points at a patch that is not there yet.
          gh release upload nightly dl/westnorth-arm64-v8a.apk dl/patch.zip --clobber
          gh release upload nightly dl/manifest.txt --clobber
